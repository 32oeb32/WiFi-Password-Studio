name: Python validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile wifi_password_studio_v2.py
      - name: Built-in self-test
        run: python wifi_password_studio_v2.py --self-test
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test menu exit
        run: printf '6\n' | NO_COLOR=1 python wifi_password_studio_v2.py
